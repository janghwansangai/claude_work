# 실습 녹화기 설치 파일 자동 빌드
#  - 데스크톱 앱: Windows(.exe 설치 파일), macOS(.dmg, Apple Silicon / Intel)
#  - 크롬 확장 프로그램(에디터 포함): .zip
# Actions 탭 → "실습 녹화기 빌드" → Run workflow 로 수동 실행하거나, desktop-v* 태그를 올리면 Release까지 만든다.
name: 실습 녹화기 빌드

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    # 작업 브랜치에 코드가 올라오면 설치 파일을 새로 만든다(Actions → 실행 기록 → Artifacts에서 내려받기).
    branches: ['claude/**']
    paths: ['packages/**', 'package.json', 'package-lock.json', '.github/workflows/walksim-build.yml']

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: packages/desktop/release/*.exe
            name: 실습녹화기-Windows
          - os: macos-latest
            script: dist:mac
            files: packages/desktop/release/*.dmg
            name: 실습녹화기-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @walksim/desktop
      - run: npm run ${{ matrix.script }} -w @walksim/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      - run: cd packages/recorder/dist && zip -r ../../../실습녹화기-크롬확장.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: 실습녹화기-크롬확장
          path: 실습녹화기-크롬확장.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: 실습 녹화기 ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            artifacts/*
            실습녹화기_최종본/1_설명서/실습녹화기_사용설명서.pdf
            실습녹화기_최종본/3_예제/샘플_학생용_회원가입연습.zip
            실습녹화기_최종본/3_예제/샘플_편집용_회원가입연습.walksim
