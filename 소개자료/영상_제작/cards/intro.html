<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Pretendard,sans-serif}
body{background:radial-gradient(1200px 800px at 15% 20%,#dbeafe 0,#eff6ff 40%,#f8fafc 100%);color:#0f172a}
.wrap{position:absolute;left:150px;top:250px;width:760px}
.badge{display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:30px;color:#2563eb}
.badge i{width:46px;height:46px;border-radius:12px;background:#2563eb;display:inline-flex;align-items:center;justify-content:center}
.badge i:after{content:"";width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35)}
h1{font-size:96px;line-height:1.12;margin:34px 0 26px;font-weight:800;letter-spacing:-2px}
h1 em{font-style:normal;color:#2563eb}
p{font-size:34px;line-height:1.55;color:#334155;margin:0;font-weight:500}
.chips{margin-top:44px;display:flex;gap:14px}.chips span{background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:12px 24px;font-size:24px;font-weight:600;color:#334155}
.shot{position:absolute;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(15,23,42,.25),0 0 0 1px rgba(15,23,42,.08);background:#fff}
.shot img{display:block;width:100%}
.s1{left:1000px;top:150px;width:860px;transform:rotate(-1.5deg)}
.s2{left:1150px;top:560px;width:700px;transform:rotate(2deg)}
</style></head><body>
<div class="wrap"><div class="badge"><i></i>실습 녹화기</div>
<h1>조작을 녹화하면<br><em>모의 실습</em>이 됩니다</h1>
<p>학생은 로그인·설치 없이<br>주소 하나로 똑같이 눌러 보며 연습해요.</p>
<div class="chips"><span>무료</span><span>Windows · Mac</span><span>Chrome 확장</span></div></div>
<div class="shot s1"><img src="shot-editor.png"></div>
<div class="shot s2"><img src="shot-student.png"></div>
</body></html>
