<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>6학년 2반 학급 누리집</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif;background:#f6f7fb;color:#1f2937}
  header{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 40px;height:68px;display:flex;align-items:center;gap:28px}
  .logo{font-weight:800;font-size:20px;color:#0f766e;display:flex;align-items:center;gap:10px}.logo i{width:34px;height:34px;border-radius:10px;background:#14b8a6;display:inline-block}
  nav a{color:#4b5563;text-decoration:none;margin-right:22px;font-size:15px} .sp{flex:1}
  .btn{border:0;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .pri{background:#0f766e;color:#fff}.ghost{background:#fff;border:1px solid #d1d5db;color:#374151}
  main{max-width:1060px;margin:0 auto;padding:44px 24px}
  .hero{background:linear-gradient(120deg,#ccfbf1,#e0f2fe);border-radius:22px;padding:48px 52px;display:flex;align-items:center;gap:40px}
  .hero h1{font-size:34px;margin:0 0 12px}.hero p{font-size:17px;color:#475569;margin:0 0 26px;line-height:1.6}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
  .card{background:#fff;border-radius:16px;padding:24px;border:1px solid #e5e7eb}.card b{display:block;font-size:17px;margin-bottom:6px}.card span{color:#6b7280;font-size:14px}
  .form{max-width:520px;margin:0 auto;background:#fff;border-radius:20px;border:1px solid #e5e7eb;padding:40px 44px}
  .form h2{margin:0 0 6px;font-size:26px}.form p.sub{margin:0 0 26px;color:#6b7280}
  label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px;color:#374151}
  input[type=text],input[type=password],input[type=email]{width:100%;height:48px;border:1px solid #d1d5db;border-radius:10px;padding:0 14px;font-size:16px;font-family:inherit}
  input:focus{outline:2px solid #14b8a6;border-color:#14b8a6}
  .agree{display:flex;gap:8px;align-items:center;font-weight:500;margin-top:20px} .full{width:100%;margin-top:26px;height:52px;font-size:17px}
  .done{text-align:center;padding:70px 20px}.done .ok{width:84px;height:84px;border-radius:50%;background:#14b8a6;color:#fff;font-size:44px;line-height:84px;margin:0 auto 22px}
  [hidden]{display:none!important}
</style></head><body>
<header><div class="logo"><i></i>6학년 2반 학급 누리집</div><nav><a href="#">공지사항</a><a href="#">알림장</a><a href="#">사진첩</a></nav><div class="sp"></div>
<button class="btn ghost" id="login">로그인</button><button class="btn pri" id="join-top">회원가입</button></header>
<main>
  <section id="home">
    <div class="hero"><div><h1>우리 반 누리집에 오신 것을 환영해요!</h1><p>알림장과 과제를 확인하려면 먼저 회원가입을 해 주세요.<br>가입은 1분이면 끝나요.</p>
      <button class="btn pri" id="join">회원가입 하기</button></div></div>
    <div class="cards"><div class="card"><b>📢 공지사항</b><span>현장체험학습 안내 (11월)</span></div><div class="card"><b>📒 알림장</b><span>수학 익힘책 42~43쪽</span></div><div class="card"><b>📷 사진첩</b><span>가을 운동회 사진</span></div></div>
  </section>
  <section id="signup" hidden><div class="form"><h2>회원가입</h2><p class="sub">아래 내용을 입력해 주세요.</p>
    <label for="name">이름</label><input type="text" id="name" placeholder="이름을 입력하세요">
    <label for="uid">아이디</label><input type="text" id="uid" placeholder="영문, 숫자 4~12자">
    <label for="pw">비밀번호</label><input type="password" id="pw" placeholder="8자 이상">
    <label for="mail">보호자 이메일</label><input type="email" id="mail" value="parent@example.com">
    <label class="agree"><input type="checkbox" id="agree"> 이용 약관에 동의합니다.</label>
    <button class="btn pri full" id="submit">가입하기</button></div></section>
  <section id="done" hidden><div class="form done"><div class="ok">✓</div><h2>가입을 환영해요!</h2><p class="sub">이제 알림장과 과제를 확인할 수 있어요.</p><button class="btn pri" id="go">누리집으로 가기</button></div></section>
</main>
<script>
const show=id=>{for(const s of ['home','signup','done'])document.getElementById(s).hidden=s!==id;scrollTo(0,0)};
for(const b of ['join','join-top'])document.getElementById(b).onclick=()=>show('signup');
document.getElementById('submit').onclick=()=>show('done');
document.getElementById('go').onclick=()=>show('home');
</script></body></html>
