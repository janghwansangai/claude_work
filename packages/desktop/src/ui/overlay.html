<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>WalkSim 녹화 영역</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; cursor: crosshair; user-select: none; }
  body { background: rgba(15, 23, 42, 0.35); }
  body.selected { background: transparent; }
  #sel { position: fixed; border: 2px solid #3b82f6; box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45); display: none; }
  #card { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); width: 560px; background: #fff; color: #111827; border-radius: 14px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); cursor: default; z-index: 2; }
  #card h1 { font-size: 17px; margin: 0 0 6px; }
  #card p { font-size: 13px; color: #4b5563; margin: 0 0 10px; line-height: 1.5; }
  .warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; margin-bottom: 10px; }
  label { display: flex; gap: 8px; font-size: 13px; align-items: flex-start; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  button { border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .primary { background: #2563eb; color: #fff; }
  .ghost { background: #f3f4f6; color: #374151; }
  #badge { position: fixed; left: 24px; top: 24px; background: #2563eb; color: #fff; font-size: 22px; font-weight: 800; border-radius: 12px; padding: 10px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 2; cursor: default; }
  #actions { position: fixed; display: none; gap: 8px; z-index: 2; cursor: default; }
</style></head>
<body>
  <div id="sel"></div>
  <div id="badge" hidden></div>
  <div id="card">
    <h1>녹화할 영역을 마우스로 드래그하세요</h1>
    <p id="multi" hidden></p>
    <p>실습할 프로그램 창 부분만 선택하면 작업표시줄·알림·다른 창이 찍히지 않습니다. 윈도우 시작 메뉴·작업표시줄을 가르칠 때는 ‘전체 화면’을 고르세요.</p>
    <div class="warn">⚠️ 실제 학생 명단·계정·메신저가 보이지 않게 준비하고, 방해 금지 모드(알림 끄기)를 켜 주세요. 입력한 글자 내용은 기록하지 않습니다.</div>
    <label><input type="checkbox" id="ready"> 더미 계정·가상 자료로 준비했고, 알림을 껐습니다.</label>
    <div class="row">
      <button class="ghost" id="cancel">취소 (Esc)</button>
      <button class="ghost" id="full" disabled>전체 화면 녹화</button>
    </div>
  </div>
  <div id="actions">
    <button class="ghost" id="redo">다시 선택</button>
    <button class="primary" id="go" disabled>이 영역 녹화 시작</button>
  </div>
  <script src="overlay.js"></script>
</body></html>
